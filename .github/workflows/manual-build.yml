name: 手动构建

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（例如 1.2.3，留空则使用 git 标签）"
        required: false
        type: string
        default: ""
      prerelease:
        description: "标记为预发布版本"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 下载依赖
        run: go mod download

      - name: 运行测试
        run: go test ./...

  build:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 下载依赖
        run: go mod download

      - name: 构建所有平台
        env:
          CGO_ENABLED: 0
        shell: bash
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(git describe --tags --always --dirty)"
            VERSION="${VERSION#v}"
          fi
          ldflags="-s -w -X github.com/Pimeng/gphira-mp-next/internal/version.version=${VERSION}"

          mkdir -p dist

          build_platform() {
            local os=$1 arch=$2
            local ext=""
            [ "$os" = "windows" ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -ldflags="$ldflags" -o "dist/gphira-mp-${os}-${arch}${ext}" ./cmd/server
            GOOS=$os GOARCH=$arch go build -ldflags="$ldflags" -o "dist/bench-${os}-${arch}${ext}" ./cmd/bench
          }

          build_platform linux amd64
          build_platform linux arm64
          build_platform linux 386
          build_platform linux arm
          build_platform linux riscv64
          build_platform windows amd64
          build_platform windows arm64
          build_platform darwin amd64
          build_platform darwin arm64
          build_platform freebsd amd64
          build_platform freebsd arm64

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: artifacts

      - name: 确定版本号
        id: version
        shell: bash
        run: |
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            echo "version=$INPUT" >> "$GITHUB_OUTPUT"
          else
            TAG="$(git describe --tags --always)"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备配置文件
        run: cp server_config.example.yml server_config.yml

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            artifacts/**/*
            server_config.yml
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: [test, build, release]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 确定版本号
        id: version
        shell: bash
        run: |
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
          else
            TAG="$(git describe --tags --always)"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 生成镜像标签
        id: meta
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            echo "tags=ghcr.io/${REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${REPO}:${TAG},ghcr.io/${REPO}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PHIRA_MP_VERSION=${{ steps.version.outputs.version }}
