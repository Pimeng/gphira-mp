name: 自动发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 下载依赖
        run: go mod download

      - name: 运行测试
        run: go test ./...

  build:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: windows
            arch: amd64
            runner: windows-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: freebsd
            arch: amd64
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 下载依赖
        run: go mod download

      - name: 构建二进制文件
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ldflags="-s -w -X github.com/Pimeng/gphira-mp-next/internal/version.version=${VERSION}"

          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi

          mkdir -p build/dist
          go build -ldflags="${ldflags}" -o "build/dist/gphira-mp${ext}" ./cmd/server
          go build -ldflags="${ldflags}" -o "build/dist/bench${ext}" ./cmd/bench

      - name: 复制附加文件
        shell: bash
        run: |
          cp -r locales build/dist/locales || true
          cp docker/entrypoint.sh build/dist/ || true
          cp docker/Dockerfile build/dist/ || true
          cp docker-compose.yml build/dist/ || true

      - name: 制作压缩包（Unix）
        if: matrix.os != 'windows'
        shell: bash
        run: |
          cd build/dist
          zip -r "../../gphira-mp-${{ matrix.os }}-${{ matrix.arch }}.zip" .

      - name: 制作压缩包（Windows）
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build\dist\* -DestinationPath "gphira-mp-${{ matrix.os }}-${{ matrix.arch }}.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gphira-mp-${{ matrix.os }}-${{ matrix.arch }}
          path: gphira-mp-${{ matrix.os }}-${{ matrix.arch }}.zip

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gphira-mp-*

      - name: 生成发布说明
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG=$(gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease == false) | .tagName] | .[0]' 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s")
          else
            git fetch --tags origin
            if git rev-parse "refs/tags/${PREVIOUS_TAG}" >/dev/null 2>&1; then
              COMMITS=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"%s")
            else
              COMMITS=$(git log --pretty=format:"%s")
            fi
          fi

          FEATURES=""
          FIXES=""
          IMPROVEMENTS=""
          OTHERS=""

          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            if [[ $line =~ ^feat(\(.*\))?:\ (.*) ]]; then
              FEATURES+="* ${BASH_REMATCH[2]}"$'\n'
            elif [[ $line =~ ^fix(\(.*\))?:\ (.*) ]]; then
              FIXES+="* ${BASH_REMATCH[2]}"$'\n'
            elif [[ $line =~ ^(perf|refactor|improve|chore)(\(.*\))?:\ (.*) ]]; then
              IMPROVEMENTS+="* ${BASH_REMATCH[3]}"$'\n'
            elif [[ ! $line =~ ^(docs|test|ci)(\(.*\))?:\ (.*) ]]; then
              OTHERS+="* $line"$'\n'
            fi
          done <<< "$COMMITS"

          NOTES="## 更新内容"$'\n'
          [ -n "$FEATURES" ] && NOTES+=$'\n'"### ✨ 新增"$'\n'"$FEATURES"
          [ -n "$FIXES" ] && NOTES+=$'\n'"### 🐛 修复"$'\n'"$FIXES"
          [ -n "$IMPROVEMENTS" ] && NOTES+=$'\n'"### 🔄 改进"$'\n'"$IMPROVEMENTS"
          [ -n "$OTHERS" ] && NOTES+=$'\n'"### 📝 其他"$'\n'"$OTHERS"

          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: [test, build, release]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_REF_NAME}"
          echo "tags=ghcr.io/${REPO}:${TAG},ghcr.io/${REPO}:latest" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PHIRA_MP_VERSION=${{ steps.meta.outputs.version }}
